<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ragnos API Test - SPA para verificar el modo API de controladores Ragnos">
    <title>Ragnos API Test</title>

    <!-- Local UI dependencies (pinned and served with the demo) -->
    <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/css/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="app.css">
</head>

<body x-data="app()" x-init="init()">

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- LOGIN SCREEN -->
    <!-- ═══════════════════════════════════════════════════ -->
    <template x-if="!isAuthenticated">
        <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
            <div class="login-card">
                <div class="login-card-header text-center">
                    <div class="login-logo mb-3">
                        <i class="bi bi-braces-asterisk"></i>
                    </div>
                    <h1 class="login-title">Ragnos <span class="text-accent">API</span> Test</h1>
                    <p class="login-subtitle">Verificación del modo API de controladores</p>
                </div>

                <div class="login-card-body">
                    <!-- Login Error -->
                    <template x-if="loginError">
                        <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center"
                            role="alert">
                            <i class="bi bi-shield-exclamation me-2"></i>
                            <span x-text="loginError"></span>
                            <button type="button" class="btn-close" @click="loginError = ''"></button>
                        </div>
                    </template>

                    <form @submit.prevent="login()" id="login-form">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="login-usuario" placeholder="Usuario"
                                x-model="loginForm.usuario" required autocomplete="username">
                            <label for="login-usuario"><i class="bi bi-person me-1"></i> Usuario</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="login-password" placeholder="Contraseña"
                                x-model="loginForm.pword" required autocomplete="current-password">
                            <label for="login-password"><i class="bi bi-lock me-1"></i> Contraseña</label>
                        </div>
                        <button type="submit" class="btn btn-accent w-100 btn-lg" :disabled="loginLoading"
                            id="login-submit-btn">
                            <span x-show="!loginLoading"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar
                                Sesión</span>
                            <span x-show="loginLoading">
                                <span class="spinner-border spinner-border-sm me-2"></span>Autenticando...
                            </span>
                        </button>
                    </form>
                </div>

                <div class="login-card-footer text-center d-flex justify-content-between align-items-center">
                    <button type="button" class="btn btn-sm btn-ghost" @click="toggleTheme()" :title="appTheme === 'dark' ? 'Modo Claro' : 'Modo Oscuro'">
                        <i class="bi" :class="appTheme === 'dark' ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-primary'"></i>
                    </button>
                    <small class="text-muted">Ragnos Framework v1.1 — Modo API</small>
                    <div style="width: 30px;"></div><!-- Spacer for centering -->
                </div>
            </div>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- MAIN APP (Authenticated) -->
    <!-- ═══════════════════════════════════════════════════ -->
    <template x-if="isAuthenticated">
        <div class="app-layout">
            <!-- SIDEBAR -->
            <aside class="app-sidebar" :class="{ 'collapsed': sidebarCollapsed }">
                <div class="sidebar-brand">
                    <i class="bi bi-braces-asterisk brand-icon"></i>
                    <span class="brand-text" x-show="!sidebarCollapsed">Ragnos API</span>
                </div>

                <nav class="sidebar-nav">
                    <div class="nav-section-title" x-show="!sidebarCollapsed">PRINCIPAL</div>
                    <a href="#" class="nav-link-item" :class="{ 'active': currentModule === 'dashboard' }"
                        @click.prevent="switchModule('dashboard')" id="nav-dashboard">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span x-show="!sidebarCollapsed">Dashboard</span>
                    </a>

                    <div class="nav-section-title" x-show="!sidebarCollapsed">OPERACIONES</div>
                    <a href="#" class="nav-link-item" :class="{ 'active': currentModule === 'pagos' }"
                        @click.prevent="switchModule('pagos')" id="nav-pagos">
                        <i class="bi bi-credit-card-2-front-fill"></i>
                        <span x-show="!sidebarCollapsed">Pagos</span>
                    </a>

                    <div class="nav-section-title" x-show="!sidebarCollapsed">CATÁLOGOS</div>
                    <template x-for="resource in catalogResources()" :key="'nav-' + resource.id">
                        <a href="#" class="nav-link-item" :class="{ 'active': currentModule === resource.id }"
                            @click.prevent="selectResource(resource.id)" :id="'nav-' + resource.id">
                            <i class="bi" :class="resource.icon || 'bi-braces'"></i>
                            <span x-show="!sidebarCollapsed" x-text="resource.title"></span>
                        </a>
                    </template>
                </nav>

                <div class="sidebar-footer">
                    <button class="btn btn-sm btn-outline-secondary w-100" @click="sidebarCollapsed = !sidebarCollapsed"
                        id="sidebar-toggle">
                        <i class="bi" :class="sidebarCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
                    </button>
                </div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <div class="app-main">
                <!-- TOP NAV BAR -->
                <header class="app-topbar">
                    <div class="topbar-left">
                        <button class="btn btn-sm btn-ghost d-lg-none" @click="sidebarCollapsed = !sidebarCollapsed">
                            <i class="bi bi-list fs-5"></i>
                        </button>
                        <nav class="breadcrumb-nav ms-2">
                            <span class="breadcrumb-item text-muted">API Test</span>
                            <i class="bi bi-chevron-right mx-1 text-muted"></i>
                            <span class="breadcrumb-item active" x-text="moduleTitle"></span>
                        </nav>
                    </div>
                    <div class="topbar-right">
                        <button class="btn btn-sm btn-ghost position-relative me-2" type="button"
                            @click="openInspector()" title="Inspector de peticiones" aria-label="Inspector de peticiones">
                            <i class="bi bi-activity"></i>
                            <span x-show="requestHistory.length" x-text="requestHistory.length"
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info"></span>
                        </button>
                        <div class="user-chip" id="user-chip">
                            <div class="user-avatar">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <div class="d-flex flex-column me-2 lh-1 text-end">
                                <span class="user-name fw-bold" x-text="userName || ('User #' + userId)"></span>
                                <small class="text-accent x-small fw-semibold mt-1" x-text="userGroup" x-show="userGroup"></small>
                            </div>
                            <button class="btn btn-sm btn-ghost ms-2" @click="toggleTheme()" :title="appTheme === 'dark' ? 'Modo Claro' : 'Modo Oscuro'">
                                <i class="bi" :class="appTheme === 'dark' ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-primary'"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger ms-1" @click="logout()" id="logout-btn"
                                title="Cerrar sesión">
                                <i class="bi bi-box-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- CONTENT -->
                <main class="app-content">

                    <!-- ═══ DASHBOARD ═══ -->
                    <template x-if="currentModule === 'dashboard'">
                        <div class="fade-in">
                            <div class="module-header">
                                <h2><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</h2>
                                <p class="text-muted">Panel de control — Ragnos API Test SPA</p>
                            </div>
                            <div class="api-status-strip mb-4" :class="openApiError ? 'is-error' : 'is-ready'">
                                <div class="d-flex align-items-center gap-3">
                                    <span class="api-status-dot" aria-hidden="true"></span>
                                    <div>
                                        <strong x-text="openApiLoading ? 'Descubriendo recursos...' : (openApiError ? 'Especificación no disponible' : 'API conectada')"></strong>
                                        <small class="d-block text-muted" x-text="openApiError || (resourceCatalog.length + ' recursos descubiertos desde OpenAPI 3.1')"></small>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-info" type="button" @click="loadOpenApi()"
                                        :disabled="openApiLoading"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</button>
                                    <a class="btn btn-sm btn-outline-secondary" :href="openApiUiUrl" target="_blank"
                                        rel="noopener"><i class="bi bi-book me-1"></i>OpenAPI</a>
                                </div>
                            </div>
                            <div class="row g-4 mb-4">
                                <div class="col-md-6 col-xl-3">
                                    <div class="stat-card stat-card-purple" @click="switchModule('pagos')">
                                        <div class="stat-icon"><i class="bi bi-credit-card-2-front-fill"></i></div>
                                        <div class="stat-info">
                                            <div class="stat-label">Pagos</div>
                                            <div class="stat-value">Gestionar</div>
                                        </div>
                                        <i class="bi bi-arrow-right stat-arrow"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 col-xl-3">
                                    <div class="stat-card stat-card-blue" @click="switchModule('clientes')">
                                        <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                                        <div class="stat-info">
                                            <div class="stat-label">Clientes</div>
                                            <div class="stat-value">Catálogo</div>
                                        </div>
                                        <i class="bi bi-arrow-right stat-arrow"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 col-xl-3">
                                    <div class="stat-card stat-card-green" @click="switchModule('productos')">
                                        <div class="stat-icon"><i class="bi bi-box-seam-fill"></i></div>
                                        <div class="stat-info">
                                            <div class="stat-label">Productos</div>
                                            <div class="stat-value">Catálogo</div>
                                        </div>
                                        <i class="bi bi-arrow-right stat-arrow"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 col-xl-3">
                                    <div class="stat-card stat-card-amber" @click="switchModule('empleados')">
                                        <div class="stat-icon"><i class="bi bi-person-badge-fill"></i></div>
                                        <div class="stat-info">
                                            <div class="stat-label">Empleados</div>
                                            <div class="stat-value">Catálogo</div>
                                        </div>
                                        <i class="bi bi-arrow-right stat-arrow"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="resource-overview mb-4">
                                <div class="d-flex align-items-center justify-content-between mb-3">
                                    <div>
                                        <h5 class="mb-1">Recursos disponibles</h5>
                                        <p class="text-muted small mb-0">Descubiertos desde la especificación publicada.</p>
                                    </div>
                                    <span class="badge text-bg-secondary" x-text="resourceCatalog.length + ' recursos'"></span>
                                </div>
                                <div class="resource-grid">
                                    <template x-for="resource in resourceCatalog" :key="'resource-' + resource.id">
                                        <button type="button" class="resource-item text-start" @click="selectResource(resource.id)">
                                            <span class="resource-icon"><i class="bi" :class="resource.icon || 'bi-braces'"></i></span>
                                            <span class="resource-copy"><strong x-text="resource.title"></strong><small x-text="'/' + resource.path"></small></span>
                                            <span class="resource-capabilities">
                                                <i class="bi bi-eye" title="Lectura"></i>
                                                <i class="bi bi-pencil" x-show="resource.supportsCrud" title="CRUD"></i>
                                                <i class="bi bi-trash3" x-show="resource.supportsDelete" title="Borrado"></i>
                                            </span>
                                        </button>
                                    </template>
                                </div>
                            </div>

                            <div class="card glass-card">
                                <div class="card-body">
                                    <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>Acerca de esta
                                        aplicación</h5>
                                    <p class="card-text text-muted">
                                        Esta SPA utiliza <strong>AlpineJS</strong> y <strong>Bootstrap 5</strong> para
                                        consumir la API REST de
                                        <strong>Ragnos Framework</strong>. Puedes probar operaciones CRUD, paginación,
                                        búsqueda y manejo de errores de validación en cada módulo.
                                    </p>
                                    <div class="row mt-3">
                                        <div class="col-md-4">
                                            <div class="feature-item">
                                                <i class="bi bi-shield-check text-success"></i>
                                                <span>Autenticación por Token</span>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="feature-item">
                                                <i class="bi bi-arrow-repeat text-info"></i>
                                                <span>CRUD Completo</span>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="feature-item">
                                                <i class="bi bi-exclamation-triangle text-warning"></i>
                                                <span>Manejo de Errores</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ═══ PAGOS MODULE ═══ -->
                    <template x-if="currentModule === 'pagos'">
                        <div x-data="pagosModule()" x-init="loadData()" class="fade-in">
                            <div class="module-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <div>
                                    <h2><i class="bi bi-credit-card-2-front-fill me-2"></i>Pagos</h2>
                                    <p class="text-muted mb-0">Registrar y capturar pagos</p>
                                </div>
                                <button class="btn btn-accent" @click="openForm()" id="pagos-new-btn">
                                    <i class="bi bi-plus-lg me-1"></i> Nuevo Pago
                                </button>
                            </div>

                            <!-- Search & Filter Bar -->
                            <div class="filter-bar mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" placeholder="Buscar pagos..."
                                        x-model="searchTerm" @input.debounce.400ms="loadData()" id="pagos-search"
                                        aria-label="Buscar pagos">
                                    <button class="btn btn-outline-secondary" @click="searchTerm=''; loadData()"
                                        x-show="searchTerm">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Loading -->
                            <template x-if="loading">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-accent" role="status"></div>
                                    <p class="mt-2 text-muted">Cargando datos...</p>
                                </div>
                            </template>

                            <!-- Data Table -->
                            <template x-if="!loading">
                                <div>
                                    <div class="table-responsive">
                                        <table class="table table-hover table-modern" id="pagos-table">
                                            <thead>
                                                <tr>
                                                    <th class="sortable" @click="sortBy('customerNumber')">
                                                        <div class="d-flex align-items-center justify-content-between">
                                                            Cliente <i class="bi" :class="getSortIcon('customerNumber')"></i>
                                                        </div>
                                                    </th>
                                                    <th class="sortable" @click="sortBy('checkNumber')">
                                                        <div class="d-flex align-items-center justify-content-between">
                                                            Nº Cheque <i class="bi" :class="getSortIcon('checkNumber')"></i>
                                                        </div>
                                                    </th>
                                                    <th class="sortable" @click="sortBy('paymentDate')">
                                                        <div class="d-flex align-items-center justify-content-between">
                                                            Fecha <i class="bi" :class="getSortIcon('paymentDate')"></i>
                                                        </div>
                                                    </th>
                                                    <th class="text-end sortable" @click="sortBy('amount')">
                                                        <div class="d-flex align-items-center justify-content-end">
                                                            Monto <i class="bi ms-2" :class="getSortIcon('amount')"></i>
                                                        </div>
                                                    </th>
                                                    <th class="text-center" style="width:120px">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="row in rows" :key="row.idPayment || row.id">
                                                    <tr class="table-row-animated">
                                                        <td x-text="row.customerName || row.customerNumber"></td>
                                                        <td><code x-text="row.checkNumber"></code></td>
                                                        <td x-text="row.paymentDate"></td>
                                                        <td class="text-end fw-semibold"
                                                            x-text="formatMoney(row.amount)"></td>
                                                        <td class="text-center">
                                                            <button class="btn btn-sm btn-outline-info me-1"
                                                                @click="editRow(row)" title="Editar">
                                                                <i class="bi bi-pencil-square"></i>
                                                            </button>
                                                            <button class="btn btn-sm btn-outline-danger"
                                                                @click="confirmDelete(row)" title="Eliminar">
                                                                <i class="bi bi-trash3"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </template>
                                                <template x-if="rows.length === 0">
                                                    <tr>
                                                        <td colspan="5" class="text-center text-muted py-4">
                                                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                                            No se encontraron registros
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                    <!-- Pagination -->
                                    <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                                        <small class="text-muted">
                                            Mostrando <span x-text="rows.length"></span> de <span
                                                x-text="totalRecords"></span> registros
                                            — Página <span x-text="currentPage"></span> de <span
                                                x-text="totalPages"></span>
                                        </small>
                                        <nav>
                                            <ul class="pagination pagination-sm mb-0">
                                                <li class="page-item" :class="{ 'disabled': currentPage <= 1 }">
                                                    <a class="page-link" href="#"
                                                        @click.prevent="goToPage(currentPage - 1)">
                                                        <i class="bi bi-chevron-left"></i>
                                                    </a>
                                                </li>
                                                <template x-for="p in paginationPages()" :key="'pag-'+p">
                                                    <li class="page-item" :class="{ 'active': p === currentPage }">
                                                        <a class="page-link" href="#" x-text="p"
                                                            @click.prevent="goToPage(p)"></a>
                                                    </li>
                                                </template>
                                                <li class="page-item"
                                                    :class="{ 'disabled': currentPage >= totalPages }">
                                                    <a class="page-link" href="#"
                                                        @click.prevent="goToPage(currentPage + 1)">
                                                        <i class="bi bi-chevron-right"></i>
                                                    </a>
                                                </li>
                                            </ul>
                                        </nav>
                                    </div>
                                </div>
                            </template>

                            <!-- FORM MODAL -->
                            <div class="modal fade" id="pagosModal" tabindex="-1" data-bs-backdrop="static">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content glass-card">
                                        <div class="modal-header border-0">
                                            <h5 class="modal-title">
                                                <i class="bi bi-credit-card-2-front me-2"></i>
                                                <span x-text="formMode === 'create' ? 'Nuevo Pago' : 'Editar Pago'">
                                                </span>
                                            </h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <!-- Validation Errors -->
                                            <template x-if="Object.keys(formErrors).length > 0">
                                                <div class="alert alert-danger">
                                                    <h6 class="alert-heading"><i
                                                            class="bi bi-exclamation-triangle me-1"></i>Errores de
                                                        Validación</h6>
                                                    <ul class="mb-0 small">
                                                        <template x-for="(msg, field) in formErrors"
                                                            :key="'err-'+field">
                                                            <li><strong x-text="field + ': '"></strong><span
                                                                    x-text="msg"></span></li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </template>

                                            <form @submit.prevent="saveForm()" id="pagos-form">
                                                <!-- Customer Number with Search -->
                                                <div class="mb-3">
                                                    <label class="form-label">Cliente <span
                                                            class="text-danger">*</span></label>
                                                    <div class="input-group">
                                                        <input type="text" class="form-control"
                                                            x-model="form.customerNumber" required
                                                            :class="{ 'is-invalid': formErrors.customerNumber }"
                                                            id="pagos-customer-input" readonly>
                                                        <button class="btn btn-outline-accent" type="button"
                                                            @click="openCustomerSearch()"
                                                            id="pagos-customer-search-btn">
                                                            <i class="bi bi-search"></i>
                                                        </button>
                                                    </div>
                                                    <small class="text-muted" x-text="customerLabel"
                                                        x-show="customerLabel"></small>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Número de Cheque <span
                                                            class="text-danger">*</span></label>
                                                    <input type="text" class="form-control"
                                                        x-model="form.checkNumber" required
                                                        :class="{ 'is-invalid': formErrors.checkNumber }"
                                                        id="pagos-check-input">
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Fecha de Pago <span
                                                            class="text-danger">*</span></label>
                                                    <input type="date" class="form-control"
                                                        x-model="form.paymentDate" required
                                                        :class="{ 'is-invalid': formErrors.paymentDate }"
                                                        id="pagos-date-input">
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Monto <span
                                                            class="text-danger">*</span></label>
                                                    <div class="input-group">
                                                        <span class="input-group-text">$</span>
                                                        <input type="text" class="form-control"
                                                            x-model="form.amount" required
                                                            :class="{ 'is-invalid': formErrors.amount }"
                                                            id="pagos-amount-input" placeholder="0.00">
                                                    </div>
                                                </div>

                                                <div class="d-flex justify-content-end gap-2 mt-4">
                                                    <button type="button" class="btn btn-outline-secondary"
                                                        data-bs-dismiss="modal">
                                                        <i class="bi bi-x-lg me-1"></i>Cancelar
                                                    </button>
                                                    <button type="submit" class="btn btn-accent" :disabled="saving"
                                                        id="pagos-save-btn">
                                                        <span x-show="!saving"><i
                                                                class="bi bi-check-lg me-1"></i>Guardar</span>
                                                        <span x-show="saving"><span
                                                                class="spinner-border spinner-border-sm me-1"></span>Guardando...</span>
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- CUSTOMER SEARCH MODAL -->
                            <div class="modal fade" id="customerSearchModal" tabindex="-1">
                                <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                                    <div class="modal-content glass-card">
                                        <div class="modal-header border-0">
                                            <h5 class="modal-title"><i class="bi bi-people me-2"></i>Buscar Cliente
                                            </h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <div class="input-group mb-3">
                                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                                <input type="text" class="form-control"
                                                    placeholder="Buscar por nombre, contacto, empleado..."
                                                    x-model="customerSearchTerm"
                                                    @input.debounce.400ms="searchCustomers()"
                                                    id="customer-search-input">
                                            </div>

                                            <template x-if="customerSearchLoading">
                                                <div class="text-center py-4">
                                                    <div class="spinner-border spinner-border-sm text-accent"></div>
                                                </div>
                                            </template>

                                            <div class="list-group list-group-flush"
                                                x-show="!customerSearchLoading">
                                                <template x-for="c in customerSearchResults"
                                                    :key="c.customerNumber || c.id">
                                                    <button type="button"
                                                        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                                                        @click="selectCustomer(c)">
                                                        <div>
                                                            <strong
                                                                x-text="c.customerName || c.customerNumber"></strong>
                                                            <br>
                                                            <small class="text-muted"
                                                                x-text="'#' + (c.customerNumber || c.id)"></small>
                                                        </div>
                                                        <i class="bi bi-check-circle text-success"></i>
                                                    </button>
                                                </template>
                                                <template
                                                    x-if="!customerSearchLoading && customerSearchResults.length === 0">
                                                    <div class="text-center text-muted py-3">
                                                        <i class="bi bi-search fs-4 d-block mb-1"></i>
                                                        Sin resultados
                                                    </div>
                                                </template>
                                            </div>

                                            <!-- Customer Search Pagination -->
                                            <div class="d-flex justify-content-between align-items-center mt-3"
                                                x-show="customerTotalPages > 1">
                                                <small class="text-muted">Página <span
                                                        x-text="customerCurrentPage"></span> de <span
                                                        x-text="customerTotalPages"></span></small>
                                                <nav>
                                                    <ul class="pagination pagination-sm mb-0">
                                                        <li class="page-item"
                                                            :class="{ 'disabled': customerCurrentPage <= 1 }">
                                                            <a class="page-link" href="#"
                                                                @click.prevent="customerGoToPage(customerCurrentPage - 1)">
                                                                <i class="bi bi-chevron-left"></i>
                                                            </a>
                                                        </li>
                                                        <template x-for="p in customerPaginationPages()"
                                                            :key="'cpag-'+p">
                                                            <li class="page-item"
                                                                :class="{ 'active': p === customerCurrentPage }">
                                                                <a class="page-link" href="#" x-text="p"
                                                                    @click.prevent="customerGoToPage(p)"></a>
                                                            </li>
                                                        </template>
                                                        <li class="page-item"
                                                            :class="{ 'disabled': customerCurrentPage >= customerTotalPages }">
                                                            <a class="page-link" href="#"
                                                                @click.prevent="customerGoToPage(customerCurrentPage + 1)">
                                                                <i class="bi bi-chevron-right"></i>
                                                            </a>
                                                        </li>
                                                    </ul>
                                                </nav>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- DELETE CONFIRM MODAL -->
                            <div class="modal fade" id="deleteModal" tabindex="-1">
                                <div class="modal-dialog modal-dialog-centered modal-sm">
                                    <div class="modal-content glass-card">
                                        <div class="modal-header border-0">
                                            <h5 class="modal-title text-danger"><i
                                                    class="bi bi-exclamation-triangle me-2"></i>Confirmar</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body text-center">
                                            <p>¿Estás seguro de eliminar este pago?</p>
                                            <small class="text-muted" x-text="'Cheque: ' + deleteTarget?.checkNumber">
                                            </small>
                                        </div>
                                        <div class="modal-footer border-0 justify-content-center">
                                            <button class="btn btn-outline-secondary btn-sm"
                                                data-bs-dismiss="modal">Cancelar</button>
                                            <button class="btn btn-danger btn-sm" @click="deleteRow()"
                                                :disabled="deleting" id="confirm-delete-btn">
                                                <span x-show="!deleting"><i
                                                        class="bi bi-trash3 me-1"></i>Eliminar</span>
                                                <span x-show="deleting"><span
                                                        class="spinner-border spinner-border-sm me-1"></span>...</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ═══ GENERIC CATALOG MODULE ═══ -->
                    <template x-if="currentModule !== 'dashboard' && currentModule !== 'pagos'">
                        <div x-data="catalogModule()" x-init="init(); loadCatalog()" class="fade-in"
                            :key="'catalog-' + $store.app.currentModule">
                            <div
                                class="module-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <div>
                                    <h2>
                                        <i class="bi me-2" :class="catalogIcon()"></i>
                                        <span x-text="catalogTitle()"></span>
                                    </h2>
                                    <p class="text-muted mb-0" x-text="'Catálogo de ' + catalogTitle().toLowerCase()">
                                    </p>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-info" type="button"
                                        @click="getRootApp()?.openInspector()">
                                        <i class="bi bi-activity me-1"></i>Inspector
                                    </button>
                                    <button class="btn btn-accent" type="button" x-show="resourceSupportsCrud()"
                                        @click="openEditor()">
                                        <i class="bi bi-plus-lg me-1"></i>Nuevo registro
                                    </button>
                                </div>
                            </div>

                            <!-- Search Bar -->
                            <div class="filter-bar mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control"
                                        :placeholder="'Buscar ' + catalogTitle().toLowerCase() + '...'"
                                        x-model="searchTerm" @input.debounce.400ms="loadCatalog()"
                                        :id="currentModule + '-search'" aria-label="Buscar en el recurso">
                                    <button class="btn btn-outline-secondary"
                                        @click="searchTerm=''; loadCatalog()" x-show="searchTerm">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Loading -->
                            <template x-if="loading">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-accent"></div>
                                    <p class="mt-2 text-muted">Cargando datos...</p>
                                </div>
                            </template>

                            <!-- Error -->
                            <template x-if="error">
                                <div class="alert alert-danger">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span x-text="error"></span>
                                </div>
                            </template>

                            <!-- Data Table -->
                            <template x-if="!loading && !error">
                                <div>
                                    <div class="table-responsive">
                                        <table class="table table-hover table-modern"
                                            :id="currentModule + '-table'">
                                            <thead>
                                                <tr>
                                                    <template x-for="col in columns" :key="'col-'+col">
                                                        <th class="sortable" @click="sortBy(col)">
                                                            <div class="d-flex align-items-center justify-content-between">
                                                                <span x-text="col"></span>
                                                                <i class="bi" :class="getSortIcon(col)"></i>
                                                            </div>
                                                        </th>
                                                    </template>
                                                    <th x-show="resourceSupportsCrud() || getConfig().supportsDelete"
                                                        class="text-center">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="(row, ri) in rows" :key="'row-'+ri">
                                                    <tr class="table-row-animated">
                                                        <template x-for="col in columns"
                                                            :key="'cell-'+ri+'-'+col">
                                                            <td x-text="row[col] ?? ''"></td>
                                                        </template>
                                                        <td x-show="resourceSupportsCrud() || getConfig().supportsDelete"
                                                            class="text-center text-nowrap">
                                                            <button class="btn btn-sm btn-outline-info me-1"
                                                                x-show="resourceSupportsCrud()" @click="openEditor(row)"
                                                                title="Editar">
                                                                <i class="bi bi-pencil-square"></i>
                                                            </button>
                                                            <button class="btn btn-sm btn-outline-danger"
                                                                x-show="getConfig().supportsDelete" @click="confirmDelete(row)"
                                                                title="Eliminar">
                                                                <i class="bi bi-trash3"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </template>
                                                <template x-if="rows.length === 0">
                                                    <tr>
                                        <td :colspan="columns.length + ((resourceSupportsCrud() || getConfig().supportsDelete) ? 1 : 0)"
                                                            class="text-center text-muted py-4">
                                                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                                            No se encontraron registros
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                    <!-- Pagination -->
                                    <div
                                        class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                                        <small class="text-muted">
                                            Mostrando <span x-text="rows.length"></span> de <span
                                                x-text="totalRecords"></span> registros
                                            — Página <span x-text="currentPage"></span> de <span
                                                x-text="totalPages"></span>
                                        </small>
                                        <nav x-show="totalPages > 1">
                                            <ul class="pagination pagination-sm mb-0">
                                                <li class="page-item"
                                                    :class="{ 'disabled': currentPage <= 1 }">
                                                    <a class="page-link" href="#"
                                                        @click.prevent="goToPage(currentPage - 1)">
                                                        <i class="bi bi-chevron-left"></i>
                                                    </a>
                                                </li>
                                                <template x-for="p in paginationPages()" :key="'cpag-'+p">
                                                    <li class="page-item"
                                                        :class="{ 'active': p === currentPage }">
                                                        <a class="page-link" href="#" x-text="p"
                                                            @click.prevent="goToPage(p)"></a>
                                                    </li>
                                                </template>
                                                <li class="page-item"
                                                    :class="{ 'disabled': currentPage >= totalPages }">
                                                    <a class="page-link" href="#"
                                                        @click.prevent="goToPage(currentPage + 1)">
                                                        <i class="bi bi-chevron-right"></i>
                                                    </a>
                                                </li>
                                            </ul>
                                        </nav>
                                    </div>

                                    <!-- Generic JSON editor for resources discovered from OpenAPI -->
                                    <div class="modal fade" :class="{ 'show d-block': editorOpen }"
                                        x-show="editorOpen" tabindex="-1" role="dialog"
                                        @keydown.escape.window="closeEditor()">
                                        <div class="modal-dialog modal-lg modal-dialog-centered">
                                            <div class="modal-content glass-card">
                                                <div class="modal-header border-0">
                                                    <h5 class="modal-title">
                                                        <i class="bi bi-braces me-2"></i>
                                                        <span x-text="editorMode === 'edit' ? 'Editar registro' : 'Nuevo registro'"></span>
                                                    </h5>
                                                    <button type="button" class="btn-close" @click="closeEditor()"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <div class="alert alert-info small">
                                                        Edita el cuerpo JSON que se enviará a <code x-text="getConfig().path + '/save'"></code>.
                                                    </div>
                                                    <template x-if="editorErrors.length">
                                                        <div class="alert alert-danger">
                                                            <ul class="mb-0"><template x-for="error in editorErrors" :key="error">
                                                                <li x-text="error"></li>
                                                            </template></ul>
                                                        </div>
                                                    </template>
                                                    <textarea class="form-control font-monospace" rows="14"
                                                        x-model="editorJson" spellcheck="false" :disabled="editorLoading"></textarea>
                                                    <small class="text-muted mt-2 d-block" x-show="editorLoading">
                                                        <span class="spinner-border spinner-border-sm me-1"></span>Cargando el registro original...
                                                    </small>
                                                </div>
                                                <div class="modal-footer border-0">
                                                    <button type="button" class="btn btn-outline-secondary"
                                                        @click="closeEditor()">Cancelar</button>
                                                    <button type="button" class="btn btn-accent" @click="saveEditor()"
                                                        :disabled="editorSaving">
                                                        <span x-show="!editorSaving"><i class="bi bi-check-lg me-1"></i>Guardar</span>
                                                        <span x-show="editorSaving"><span class="spinner-border spinner-border-sm me-1"></span>Guardando...</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div x-show="editorOpen" class="modal-backdrop fade show"></div>

                                    <template x-if="deleteTarget">
                                        <div class="alert alert-warning d-flex align-items-center justify-content-between mt-3">
                                            <span><i class="bi bi-exclamation-triangle me-2"></i>¿Eliminar este registro?</span>
                                            <span class="d-flex gap-2">
                                                <button class="btn btn-sm btn-outline-secondary" @click="cancelDelete()">Cancelar</button>
                                                <button class="btn btn-sm btn-danger" @click="deleteRecord()" :disabled="deleting">
                                                    <span x-show="!deleting">Eliminar</span><span x-show="deleting">Eliminando...</span>
                                                </button>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                </main>
            </div>
        </div>
    </template>

    <!-- API REQUEST INSPECTOR -->
    <div class="modal fade" :class="{ 'show d-block': inspectorOpen }" x-show="inspectorOpen"
        tabindex="-1" role="dialog" @keydown.escape.window="closeInspector()">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title"><i class="bi bi-activity me-2"></i>Inspector de peticiones API</h5>
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" @click="clearRequestHistory()"
                            :disabled="requestHistory.length === 0"><i class="bi bi-trash3 me-1"></i>Limpiar</button>
                        <button type="button" class="btn-close" @click="closeInspector()"></button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-lg-4">
                            <div class="list-group">
                                <template x-for="(request, index) in requestHistory" :key="'request-' + index">
                                    <button type="button" class="list-group-item list-group-item-action text-start"
                                        :class="{ active: selectedRequest === request }"
                                        @click="selectedRequest = request">
                                        <div class="d-flex justify-content-between">
                                            <strong x-text="request.method"></strong>
                                            <span :class="request.ok ? 'text-success' : 'text-danger'"
                                                x-text="request.status || 'NETWORK'"></span>
                                        </div>
                                        <small class="text-truncate d-block" x-text="request.url"></small>
                                        <small class="text-muted" x-text="request.duration + ' ms'"></small>
                                    </button>
                                </template>
                                <div x-show="requestHistory.length === 0" class="text-muted small p-3">
                                    Todavía no hay peticiones registradas.
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-8" x-show="selectedRequest">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <code x-text="selectedRequest?.method + ' ' + selectedRequest?.url"></code>
                                <button class="btn btn-sm btn-outline-info" @click="copyRequest()">
                                    <i class="bi bi-clipboard me-1"></i>Copiar curl
                                </button>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <h6>Petición</h6>
                                    <pre class="inspector-code" x-text="JSON.stringify(selectedRequest?.requestBody, null, 2)"></pre>
                                </div>
                                <div class="col-md-6">
                                    <h6>Respuesta</h6>
                                    <pre class="inspector-code" x-text="JSON.stringify(selectedRequest?.responseBody, null, 2)"></pre>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div x-show="inspectorOpen" class="modal-backdrop fade show"></div>

    <!-- TOAST NOTIFICATIONS -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area" aria-live="polite"
        aria-atomic="true">
        <template x-for="(t, ti) in toasts" :key="'toast-'+ti">
            <div class="toast show glass-toast" :class="'toast-' + t.type" role="alert">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi" :class="{
                        'bi-check-circle-fill text-success': t.type === 'success',
                        'bi-exclamation-triangle-fill text-danger': t.type === 'error',
                        'bi-info-circle-fill text-info': t.type === 'info'
                    }"></i>
                    <span x-text="t.message"></span>
                    <button type="button" class="btn-close btn-close-white ms-auto btn-sm"
                        @click="removeToast(ti)"></button>
                </div>
            </div>
        </template>
    </div>

    <!-- Scripts -->
    <script src="vendor/js/bootstrap.bundle.min.js"></script>
    <script defer src="vendor/js/alpinejs.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
